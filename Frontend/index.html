<!doctype html>
<html lang="es" class="dark">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/vite.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Realart</title>
    <!-- Premium Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet" />
    <!-- Material Icons -->
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:opsz,wght,FILL,GRAD@20..48,100..700,0..1,-50..200" />
    <style>
      /* Light mode overrides */
      html:not(.dark) {
        background-color: #f8fafc;
        color-scheme: light;
      }
      
      html:not(.dark) body {
        background: linear-gradient(180deg, rgba(241, 245, 250, 1) 0%, rgba(226, 232, 240, 1) 100%);
        color: #1e293b;
      }
      
      html:not(.dark) .app-container {
        background: linear-gradient(180deg, rgba(248, 250, 252, 1) 0%, rgba(241, 245, 250, 1) 100%);
      }
      
      html:not(.dark) .glass-card {
        background: rgba(248, 250, 252, 0.8);
        border-color: rgba(15, 23, 42, 0.12);
      }
      
      html:not(.dark) .glass-panel {
        background-color: rgba(248, 250, 252, 0.8);
        border-color: rgba(15, 23, 42, 0.2);
      }
      
      html:not(.dark) .glass-panel-hover:hover {
        background-color: rgba(248, 250, 252, 0.95);
        border-color: rgba(59, 130, 246, 0.4);
        box-shadow: 0 10px 30px -10px rgba(59, 130, 246, 0.3);
      }
      
      html:not(.dark) .custom-scrollbar::-webkit-scrollbar-thumb {
        background: #cbd5e1;
      }
      
      html:not(.dark) .custom-scrollbar::-webkit-scrollbar-thumb:hover {
        background: #3b82f6;
      }
      
      html:not(.dark) .section-title {
        color: #0f172a;
      }
      
      html:not(.dark) .section-subtitle {
        color: #475569;
      }
    </style>
  </head>
  <body class="bg-bg-deep text-slate-100 font-sans antialiased transition-colors duration-300">
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
