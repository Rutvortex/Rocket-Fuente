<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>Vortex - Join the community</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700;800&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffffff",
                        "background-light": "#f6f7f8",
                        "background-dark": "#000000",
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: {
                        "DEFAULT": "0.5rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        .custom-radio:checked+div {
            border-color: #ffffff;
            background-color: rgba(255, 255, 255, 0.05);
        }

        .custom-radio:checked+div .radio-dot {
            background-color: #ffffff;
            border-color: #ffffff;
        }
    </style>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen font-display">
    <div class="relative flex h-auto min-h-screen w-full flex-col overflow-x-hidden">
        <div class="layout-container flex h-full grow flex-col">
            <!-- Navigation Header -->
            <header
                class="flex items-center justify-between border-b border-slate-200 dark:border-slate-800 px-6 py-4 md:px-10 lg:px-40">
                <div class="flex items-center gap-3">
                    <div class="bg-white p-1.5 rounded-lg flex items-center justify-center">
                        <span class="material-symbols-outlined text-black text-2xl">rocket_launch</span>
                    </div>
                    <h2 class="text-slate-900 dark:text-slate-100 text-xl font-bold tracking-tight">Vortex</h2>
                </div>
                <div class="flex items-center gap-4">
                    <span class="hidden md:block text-sm text-slate-500 dark:text-slate-400">Already have an
                        account?</span>
                    <button id="header-signin-btn" class="text-sm font-semibold hover:underline text-white">Sign In</button>
                    <button id="header-close-btn"
                        class="flex items-center justify-center rounded-lg h-10 w-10 bg-slate-200 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-slate-300 dark:hover:bg-slate-700 transition-colors">
                        <span class="material-symbols-outlined text-[20px]">close</span>
                    </button>
                </div>
            </header>
            <main class="flex-1 flex justify-center py-10 px-4 md:px-0">
                <div class="w-full max-w-[520px] flex flex-col gap-8">
                    <!-- Title Section -->
                    <div class="flex flex-col gap-2">
                        <h1 class="text-slate-900 dark:text-slate-100 text-4xl font-extrabold tracking-tight">Join the
                            community</h1>
                        <p class="text-slate-600 dark:text-slate-400 text-lg">Select your journey and set up your
                            profile.</p>
                    </div>
                    <!-- Role Toggle -->
                    <div class="flex flex-col gap-4">
                        <h3 class="text-slate-900 dark:text-slate-100 text-sm font-bold uppercase tracking-widest">I am
                            a...</h3>
                        <div class="flex h-12 w-full items-center justify-center rounded-xl bg-slate-200 dark:bg-slate-800/50 p-1.5 border border-slate-300 dark:border-slate-800"
                            id="role-selector">
                            <label
                                class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-4 transition-all has-[:checked]:bg-white dark:has-[:checked]:bg-white has-[:checked]:text-black text-slate-500 dark:text-slate-400 text-sm font-bold">
                                <span class="truncate">User</span>
                                <input checked="" class="hidden" name="user_type" type="radio" value="User" />
                            </label>
                            <label
                                class="flex cursor-pointer h-full grow items-center justify-center overflow-hidden rounded-lg px-4 transition-all has-[:checked]:bg-white dark:has-[:checked]:bg-white has-[:checked]:text-black text-slate-500 dark:text-slate-400 text-sm font-bold">
                                <span class="truncate">Creator</span>
                                <input class="hidden" name="user_type" type="radio" value="Creator" />
                            </label>
                        </div>
                    </div>
                    <!-- Account Details (New Section) -->
                    <div class="flex flex-col gap-4">
                        <h3 class="text-slate-900 dark:text-slate-100 text-sm font-bold uppercase tracking-widest">
                            Details</h3>
                        <input type="text" id="username" placeholder="Username"
                            class="bg-slate-100 dark:bg-slate-800 border-none rounded-xl h-12 px-4 text-sm" />
                        <input type="email" id="email" placeholder="Email"
                            class="bg-slate-100 dark:bg-slate-800 border-none rounded-xl h-12 px-4 text-sm" />
                        <input type="password" id="password" placeholder="Password"
                            class="bg-slate-100 dark:bg-slate-800 border-none rounded-xl h-12 px-4 text-sm" />
                    </div>
                    <!-- Account Type Selection -->
                    <div class="flex flex-col gap-4" id="account-type-selector">
                        <h3 class="text-slate-900 dark:text-slate-100 text-sm font-bold uppercase tracking-widest">
                            Account Type</h3>
                        <div class="grid gap-4">
                            <!-- Personal Option -->
                            <label class="relative flex items-center cursor-pointer group">
                                <input checked="" class="peer hidden custom-radio" name="sub_type" type="radio"
                                    value="Personal" />
                                <div
                                    class="flex w-full items-center gap-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 p-5 transition-all peer-checked:border-white peer-checked:bg-white/5 hover:border-slate-300 dark:hover:border-slate-700">
                                    <div
                                        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 group-hover:text-white transition-colors">
                                        <span class="material-symbols-outlined text-2xl">person</span>
                                    </div>
                                    <div class="grow">
                                        <p class="text-slate-900 dark:text-slate-100 font-bold">Personal</p>
                                        <p class="text-slate-500 dark:text-slate-400 text-sm">Best for individual
                                            exploration and private use.</p>
                                    </div>
                                    <div
                                        class="h-5 w-5 rounded-full border-2 border-slate-300 dark:border-slate-700 flex items-center justify-center shrink-0 radio-dot">
                                        <div class="h-2 w-2 rounded-full bg-black opacity-0 peer-checked:opacity-100">
                                        </div>
                                    </div>
                                </div>
                            </label>
                            <!-- Infantil Option -->
                            <label class="relative flex items-center cursor-pointer group">
                                <input class="peer hidden custom-radio" name="sub_type" type="radio" value="Infantil" />
                                <div
                                    class="flex w-full items-center gap-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 p-5 transition-all peer-checked:border-white peer-checked:bg-white/5 hover:border-slate-300 dark:hover:border-slate-700">
                                    <div
                                        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 group-hover:text-white transition-colors">
                                        <span class="material-symbols-outlined text-2xl">child_care</span>
                                    </div>
                                    <div class="grow">
                                        <p class="text-slate-900 dark:text-slate-100 font-bold">Infantil</p>
                                        <p class="text-slate-500 dark:text-slate-400 text-sm">Protected environment for
                                            children and minors.</p>
                                    </div>
                                    <div
                                        class="h-5 w-5 rounded-full border-2 border-slate-300 dark:border-slate-700 flex items-center justify-center shrink-0 radio-dot">
                                        <div class="h-2 w-2 rounded-full bg-black opacity-0 peer-checked:opacity-100">
                                        </div>
                                    </div>
                                </div>
                            </label>
                            <!-- Empresarial Option -->
                            <label class="relative flex items-center cursor-pointer group">
                                <input class="peer hidden custom-radio" name="sub_type" type="radio"
                                    value="Empresarial" />
                                <div
                                    class="flex w-full items-center gap-4 rounded-xl border-2 border-slate-200 dark:border-slate-800 p-5 transition-all peer-checked:border-white peer-checked:bg-white/5 hover:border-slate-300 dark:hover:border-slate-700">
                                    <div
                                        class="flex h-12 w-12 shrink-0 items-center justify-center rounded-full bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 group-hover:text-white transition-colors">
                                        <span class="material-symbols-outlined text-2xl">corporate_fare</span>
                                    </div>
                                    <div class="grow">
                                        <p class="text-slate-900 dark:text-slate-100 font-bold">Empresarial</p>
                                        <p class="text-slate-500 dark:text-slate-400 text-sm">Full team management and
                                            enterprise tools.</p>
                                    </div>
                                    <div
                                        class="h-5 w-5 rounded-full border-2 border-slate-300 dark:border-slate-800 flex items-center justify-center shrink-0 radio-dot">
                                        <div class="h-2 w-2 rounded-full bg-black opacity-0 peer-checked:opacity-100">
                                        </div>
                                    </div>
                                </div>
                            </label>
                        </div>
                    </div>
                    <!-- Action Button -->
                    <div class="flex flex-col gap-4 mt-4">
                        <button id="signup-btn"
                            class="w-full bg-white hover:bg-slate-200 text-black font-bold h-14 rounded-xl transition-all shadow-lg shadow-white/10 flex items-center justify-center gap-2">
                            <span>Continue</span>
                            <span class="material-symbols-outlined">arrow_forward</span>
                        </button>
                        <p class="text-center text-xs text-slate-500 dark:text-slate-400 px-8">
                            By clicking continue, you agree to our <a class="underline hover:text-white" href="#">Terms
                                of Service</a> and <a class="underline hover:text-white" href="#">Privacy Policy</a>.
                        </p>
                    </div>
                </div>
            </main>
            <!-- Footer Decorative Element -->
            <footer class="mt-auto py-10 flex justify-center opacity-30 grayscale pointer-events-none overflow-hidden">
                <div class="flex gap-8 items-center text-slate-500 overflow-hidden whitespace-nowrap">
                    <span class="text-2xl font-black uppercase tracking-[1em]">Connect</span>
                    <span class="text-2xl font-black uppercase tracking-[1em]">Innovate</span>
                    <span class="text-2xl font-black uppercase tracking-[1em]">Expand</span>
                    <span class="text-2xl font-black uppercase tracking-[1em]">Connect</span>
                </div>
            </footer>
        </div>
    </div>
    <!-- Sign In Modal -->
    <div id="signin-modal"
        class="fixed inset-0 z-[100] hidden flex items-center justify-center p-4 bg-black/60 backdrop-blur-sm">
        <div
            class="w-full max-w-md bg-white dark:bg-slate-900 rounded-2xl shadow-2xl overflow-hidden animate-in fade-in zoom-in duration-300">
            <div class="px-8 pt-8 pb-6">
                <div class="flex items-center justify-between mb-8">
                    <h2 class="text-2xl font-bold text-slate-900 dark:text-white">Sign In</h2>
                    <button id="close-signin"
                        class="p-2 rounded-lg hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors">
                        <span class="material-symbols-outlined text-slate-500">close</span>
                    </button>
                </div>
                <form id="signin-form" class="space-y-4">
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Email</label>
                        <input type="email" id="signin-email"
                            class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-white transition-all transition-all"
                            placeholder="name@example.com" required>
                    </div>
                    <div class="space-y-1.5">
                        <label class="text-sm font-semibold text-slate-700 dark:text-slate-300 ml-1">Password</label>
                        <input type="password" id="signin-password"
                            class="w-full px-4 py-3 rounded-xl bg-slate-50 dark:bg-slate-800 border-none focus:ring-2 focus:ring-slate-900 dark:focus:ring-white transition-all transition-all"
                            placeholder="••••••••" required>
                    </div>
                    <button type="submit"
                        class="w-full py-4 bg-slate-900 dark:bg-white text-white dark:text-slate-900 rounded-xl font-bold text-lg hover:opacity-90 active:scale-[0.98] transition-all mt-4">
                        Continue
                    </button>
                    <div class="text-center mt-6">
                        <p class="text-sm text-slate-500">Don't have an account? <button type="button"
                                id="switch-to-signup"
                                class="font-bold text-slate-900 dark:text-white hover:underline">Create one</button></p>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../CreateAccount.js"></script>
    <script src="../shared.js"></script>
</body>

</html>
