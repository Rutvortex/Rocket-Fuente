<!DOCTYPE html>

<html class="dark" lang="en">

<head>
    <meta charset="utf-8" />
    <meta content="width=device-width, initial-scale=1.0" name="viewport" />
    <title>SocialNet - Modern Feed</title>
    <script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
    <link href="https://fonts.googleapis.com/css2?family=Spline+Sans:wght@300;400;500;600;700&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <link
        href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap"
        rel="stylesheet" />
    <script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    colors: {
                        "primary": "#ffffff",
                        "background-light": "#f6f7f8",
                        "background-dark": "#000000",
                        "accent": "#333333"
                    },
                    fontFamily: {
                        "display": ["Inter", "sans-serif"]
                    },
                    borderRadius: { "DEFAULT": "0.5rem", "lg": "0.5rem", "xl": "0.5rem", "full": "9999px" },
                },
            },
        }
    </script>
    <style>
        body {
            font-family: 'Spline Sans', sans-serif;
        }

        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
    <script>
        const savedTheme = localStorage.getItem('theme') || 'dark';
        if (savedTheme === 'dark') document.documentElement.classList.add('dark');
        else document.documentElement.classList.remove('dark');

        const savedFontSize = localStorage.getItem('fontSize') || '16';
        document.documentElement.style.fontSize = savedFontSize + 'px';
    </script>
</head>

<body class="bg-background-light dark:bg-background-dark text-slate-900 dark:text-slate-100 min-h-screen"
    style="font-family: 'Inter', sans-serif;">
    <div
        class="relative flex h-auto min-h-screen w-full flex-col bg-background-light dark:bg-background-dark overflow-x-hidden">
        <!-- Top Navigation Bar -->
        <header
            class="sticky top-0 z-50 flex items-center justify-between whitespace-nowrap border-b border-solid border-slate-200 dark:border-slate-800 bg-background-light/80 dark:bg-background-dark/80 backdrop-blur-md px-4 md:px-10 py-3">
            <div class="flex items-center gap-8">
                <div class="flex items-center gap-4">
                    <div class="size-8 flex items-center justify-center bg-primary/10 rounded-lg">
                        <span class="material-symbols-outlined">hub</span>
                    </div>
                    <h2
                        class="text-slate-900 dark:text-slate-100 text-lg font-bold leading-tight tracking-[-0.015em] font-display">
                        Vortex</h2>
                </div>
                <label class="hidden md:flex flex-col min-w-40 h-10 max-w-64">
                    <div class="flex w-full flex-1 items-stretch rounded-lg h-full overflow-hidden">
                        <div
                            class="text-slate-500 dark:text-slate-400 flex border-none bg-slate-100 dark:bg-slate-800 items-center justify-center pl-4">
                            <span class="material-symbols-outlined text-[20px]">search</span>
                        </div>
                        <input
                            class="form-input flex w-full min-w-0 flex-1 resize-none overflow-hidden text-slate-900 dark:text-slate-100 focus:outline-0 focus:ring-0 border-none bg-slate-100 dark:bg-slate-800 placeholder:text-slate-500 dark:placeholder:text-slate-400 px-4 pl-2 text-base font-normal"
                            placeholder="Search" value="" />
                    </div>
                </label>
            </div>
            <div class="flex items-center gap-4">
                <div class="flex gap-2">
                    <button id="btn-notifications"
                        class="flex items-center justify-center rounded-lg h-10 w-10 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-primary/10 hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">notifications</span>
                    </button>
                    <button id="btn-messages"
                        class="flex items-center justify-center rounded-lg h-10 w-10 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-primary/10 hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">chat_bubble</span>
                    </button>
                    <button id="btn-settings"
                        class="flex items-center justify-center rounded-lg h-10 w-10 bg-slate-100 dark:bg-slate-800 text-slate-600 dark:text-slate-300 hover:bg-primary/10 hover:text-primary transition-colors">
                        <span class="material-symbols-outlined">settings</span>
                    </button>
                </div>
                <div class="h-10 w-10 rounded-full bg-slate-200 dark:bg-slate-700 bg-cover bg-center border border-slate-300 dark:border-slate-600"
                    data-alt="User profile avatar portrait"
                    style='background-image: url("https://lh3.googleusercontent.com/aida-public/AB6AXuBafmUHEChzidOg_OXoghJOawclVFacBq3GlPZO6NWtI1KZQmP16zRrWIp2-2TFbWsfGWrIpIzaaVT3Bu8aVx_-aBO6RzZlafwC9oVEEDnZaK03UwUn81QSN020f2-UbuebZWhxtuvtJy1iffcfdLXAKmnDfS5VmBtSY8xEvDlcTkoKZTgUu77Dc2RvzvK9HWWWeXdisaWMm1D4HBeupQGzn4T9fLOurwcVC2o4Krss0TxOYzneIwjfd8adJtv15dU2lreh8Dt4_GM");'>
                </div>
            </div>
        </header>
        <main class="flex flex-1 justify-center px-4 md:px-10 py-6 gap-6 max-w-[1440px] mx-auto w-full">
            <!-- Left Sidebar Navigation -->
            <aside class="hidden lg:flex flex-col w-64 shrink-0 gap-6">
                <div class="flex flex-col gap-2">
                    <div id="sidebar-home" class="flex items-center gap-3 px-3 py-3 rounded-xl bg-primary/10 text-primary bg-white/10 cursor-pointer transition-colors">
                        <span class="material-symbols-outlined fill-1">home</span>
                        <p class="text-sm font-bold leading-normal">Home Feed</p>
                    </div>
                    <div id="sidebar-messaging"
                        class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
                        <span class="material-symbols-outlined">mail</span>
                        <p class="text-sm font-medium leading-normal">Messaging</p>
                    </div>
                    <div id="sidebar-groups"
                        class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
                        <span class="material-symbols-outlined">groups</span>
                        <p class="text-sm font-medium leading-normal">Groups</p>
                    </div>
                    <div id="sidebar-videos"
                        class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
                        <span class="material-symbols-outlined">play_circle</span>
                        <p class="text-sm font-medium leading-normal">Videos</p>
                    </div>
                    <div id="sidebar-saved"
                        class="flex items-center gap-3 px-3 py-3 rounded-xl text-slate-600 dark:text-slate-400 hover:bg-slate-100 dark:hover:bg-slate-800 transition-colors cursor-pointer">
                        <span class="material-symbols-outlined">bookmark</span>
                        <p class="text-sm font-medium leading-normal">Saved Posts</p>
                    </div>
                </div>
                <div class="p-4 bg-slate-100 dark:bg-slate-800 rounded-xl">
                    <h3 class="text-xs font-bold uppercase tracking-wider text-slate-500 mb-3">Your Pages</h3>
                    <div class="flex flex-col gap-3">
                        <div id="nav-dmi" class="flex items-center gap-3 cursor-pointer hover:text-primary transition-colors">
                            <div class="size-8 rounded-lg bg-orange-500 flex items-center justify-center text-white font-bold text-xs">D</div>
                            <span class="text-sm font-medium">Data Interface</span>
                        </div>
                        <div id="nav-achievements" class="flex items-center gap-3 cursor-pointer hover:text-primary transition-colors">
                            <div class="size-8 rounded-lg bg-emerald-500 flex items-center justify-center text-white font-bold text-xs">A</div>
                            <span class="text-sm font-medium">Achievements</span>
                        </div>
                        <div id="nav-rewards" class="flex items-center gap-3 cursor-pointer hover:text-primary transition-colors">
                            <div class="size-8 rounded-lg bg-blue-500 flex items-center justify-center text-white font-bold text-xs">R</div>
                            <span class="text-sm font-medium">Rewards</span>
                        </div>
                        <div id="nav-shorts" class="flex items-center gap-3 cursor-pointer hover:text-primary transition-colors">
                            <div class="size-8 rounded-lg bg-purple-500 flex items-center justify-center text-white font-bold text-xs">S</div>
                            <span class="text-sm font-medium">Shorts</span>
                        </div>
                        <div id="nav-profile" class="flex items-center gap-3 cursor-pointer hover:text-primary transition-colors">
                            <div class="size-8 rounded-lg bg-slate-500 flex items-center justify-center text-white font-bold text-xs">P</div>
                            <span class="text-sm font-medium">Profile</span>
                        </div>
                    </div>
                </div>
                <button id="btn-create-post-sidebar"
                    class="flex items-center justify-center gap-2 w-full py-3 bg-primary rounded-xl font-bold text-sm shadow-lg hover:bg-primary/90 transition-all text-black shadow-white/10">
                    <span class="material-symbols-outlined text-sm">add</span>
                    <span>Create Post</span>
                </button>
            </aside>
            <!-- Central Feed Column -->
            <div class="flex-1 flex flex-col gap-6 max-w-[640px]">
                <!-- Create Post Box -->
                <div
                    class="bg-white dark:bg-slate-900 border border-slate-200 dark:border-slate-800 rounded-xl p-4 @container shadow-sm">
                    <div class="flex items-start gap-4">
                        <div class="bg-slate-200 dark:bg-slate-700 bg-cover bg-center rounded-full size-10 shrink-0 border border-slate-100 dark:border-slate-800"
                            id="current-user-avatar"></div>
                        <div class="flex-1 flex flex-col gap-3">
                            <textarea id="post-content"
                                class="form-input w-full resize-none border-none bg-slate-50 dark:bg-slate-800/50 rounded-lg focus:ring-1 focus:ring-primary/50 text-slate-900 dark:text-slate-100 placeholder:text-slate-500 p-3 min-h-[80px]"
                                placeholder="What's on your mind?"></textarea>
                            <div
                                class="flex items-center justify-between pt-2 border-t border-slate-100 dark:border-slate-800">
                                <div class="flex gap-1">
                                    <button id="btn-upload-image"
                                        class="p-2 text-slate-500 hover:text-primary hover:bg-primary/10 rounded-lg transition-colors flex items-center gap-1 text-sm">
                                        <span class="material-symbols-outlined text-[20px]">image</span>
                                        <span class="hidden sm:inline">Photo</span>
                                    </button>
                                </div>
                                <button id="submit-post"
                                    class="px-6 py-2 bg-primary rounded-lg font-bold text-sm hover:bg-primary/90 transition-colors text-black">
                                    Post
                                </button>
                            </div>
                        </div>
                    </div>
                </div>
                <!-- Dynamic Feed Container -->
                <div id="feed-container" class="flex flex-col gap-6">
                    <!-- Posts will be injected here -->
                    <div class="text-center py-10 text-slate-500">Loading feed...</div>
                </div>
            </div>
            <!-- Right Sidebar -->
            ...
        </main>
        ...
    </div>
    <script src="MainHub.js"></script>
    <script src="../shared.js"></script>
</body>

</html>
